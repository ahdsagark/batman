<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#080a0e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6b437"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="#232a38" stroke-width="4"/>
  
  <!-- Minimalist Geometric Command Emblem -->
  <g transform="translate(256, 256)">
    <!-- Outer Shield / Diamond Frame -->
    <path d="M 0,-140 L 130,-20 L 80,130 L 0,160 L -80,130 L -130,-20 Z" 
          fill="none" stroke="#2d3748" stroke-width="12" stroke-linejoin="round"/>
    <!-- Center Minimal Monogram 'B' Monolith -->
    <path d="M -45,-90 L 20,-90 C 50,-90 65,-70 65,-45 C 65,-25 50,-10 30,-5 C 55,0 70,18 70,45 C 70,75 50,90 20,90 L -45,90 Z" 
          fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-15" y1="-5" x2="25" y2="-5" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round"/>
    <!-- Focus Indicator Dots -->
    <circle cx="0" cy="-140" r="8" fill="#e6b437"/>
    <circle cx="0" cy="160" r="8" fill="#e6b437"/>
  </g>
</svg>
