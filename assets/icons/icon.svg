<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141a24"/>
      <stop offset="60%" stop-color="#090c10"/>
      <stop offset="100%" stop-color="#040608"/>
    </radialGradient>

    <!-- Disc Gradient -->
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2430"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Batman Metallic Platinum / Cyan Accent Gradient -->
    <linearGradient id="batmanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Ambient Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-Bleed App Canvas (Eliminates OS white borders) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Centered Circular Emblem (Within Maskable Safe Zone) -->
  <circle cx="256" cy="256" r="190" fill="url(#discGrad)" stroke="#1e293b" stroke-width="4"/>
  <circle cx="256" cy="256" r="186" fill="none" stroke="rgba(0, 229, 255, 0.25)" stroke-width="2"/>

  <!-- Precision Scaled Batman Silhouette (Leaves 120px+ Safe Zone Padding on all sides) -->
  <g transform="translate(256, 256) scale(5.8) translate(-24, -24)" filter="url(#cyanGlow)">
    <path fill="url(#batmanGrad)" d="M24,18.2c0.7,0,0.9,0.2,0.9,0.2l0.4-1.7c0,0,0.4,1.5,0.4,2.8c0.2,1.1,2.2,0.4,3.9,0C31.4,19.1,32,16,32,16h16c0,0-9.4,3.5-7,10c0,0-14.8-2-17,7l0,0c-2.2-9-17-7-17-7c2.4-6.5-7-10-7-10h16c0,0,0.6,3.1,2.3,3.5c1.7,0.4,3.9,1.1,3.9,0c0.2-1.1,0.4-2.8,0.4-2.8l0.4,1.7C23.1,18.4,23.4,18.2,24,18.2L24,18.2L24,18.2z"/>
  </g>
</svg>
